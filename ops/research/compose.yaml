name: fleet-research-observation
services:
  tempo:
    profiles: [research]
    image: grafana/tempo:3.1.1@sha256:64e2fbd56d9c2b3412a4b430a58ea59e91a670b1e75f920a0c702213ad145044
    command: [-config.file=/etc/tempo.yaml, -target=all]
    volumes: [./tempo.yaml:/etc/tempo.yaml:ro, tempo:/var/tempo]
    ports: [127.0.0.1::3200]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
  collector:
    profiles: [research]
    image: otel/opentelemetry-collector-contrib:0.164.0@sha256:340c9ca6a36617084c6661bdc4f0fe92b7cda5a805d61673ec8db375fddc522b
    command: [--config=/etc/collector.yaml]
    volumes: [./otel-collector.yaml:/etc/collector.yaml:ro]
    ports: [127.0.0.1::4318]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    depends_on: [tempo]
  prometheus:
    profiles: [research]
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    command:
      [
        --config.file=/etc/prometheus.yaml,
        --storage.tsdb.path=/prometheus,
        --storage.tsdb.retention.time=24h,
        --storage.tsdb.retention.size=256MB,
      ]
    volumes: [./prometheus.yaml:/etc/prometheus.yaml:ro, prometheus:/prometheus]
    ports: [127.0.0.1::9090]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
  grafana:
    profiles: [research]
    image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    env_file: ["${FLEET_GRAFANA_ENV_FILE:?private env file required}"]
    environment:
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      [
        ./grafana/provisioning:/etc/grafana/provisioning:ro,
        ./grafana/dashboards:/var/lib/grafana/dashboards:ro,
        grafana:/var/lib/grafana,
      ]
    ports: [127.0.0.1::3000]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
volumes:
  tempo:
  prometheus:
  grafana:
