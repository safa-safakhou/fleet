global:
  scrape_interval: 1s
  evaluation_interval: 1s
scrape_configs:
  - job_name: fleet
    static_configs:
      - targets: [collector:8889]
  - job_name: collector
    static_configs:
      - targets: [collector:8888]
  - job_name: tempo
    static_configs:
      - targets: [tempo:3200]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
