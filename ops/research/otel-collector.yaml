receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  batch:
    timeout: 200ms
    send_batch_size: 128
    send_batch_max_size: 256
exporters:
  otlp_http/tempo:
    endpoint: http://tempo:4318
    timeout: 2s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 2s
      max_elapsed_time: 10s
    sending_queue:
      enabled: true
      queue_size: 1000
  prometheus:
    endpoint: 0.0.0.0:8889
    metric_expiration: 10m
    resource_to_telemetry_conversion:
      enabled: false
service:
  telemetry:
    logs:
      level: error
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
