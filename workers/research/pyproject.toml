[project]
name = "fleet-research"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic==2.12.5", "grpcio==1.78.0", "protobuf==6.33.5", "pydantic-ai-slim==2.63.0"]
[project.scripts]
fleet-research-worker = "fleet_research.cli:main"
[project.optional-dependencies]
agent = []
embedding = ["sentence-transformers==6.2.0"]
optimization = ["dspy==3.4.1", "mlflow==3.17.2"]
[dependency-groups]
dev = ["pytest==9.0.2", "hypothesis==6.151.9", "grpcio-tools==1.78.0", "ruff==0.17.3", "mypy==2.4.1"]
[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/fleet_research"]
